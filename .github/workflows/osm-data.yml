name: Odśwież dane OSM
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-osm.mjs'
      - 'scripts/build-data.ts'
      - '.github/workflows/osm-data.yml'
permissions:
  contents: write
jobs:
  build-data:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip osm]')"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run osm:fetch
      - run: npm run osm:build
      - name: Commit danych
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && echo "Bez zmian" && exit 0
          git commit -m "Dane OSM: odświeżenie $(date -u +%F) [skip osm]"
          git push
